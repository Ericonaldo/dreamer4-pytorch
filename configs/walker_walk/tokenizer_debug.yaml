stage: tokenizer

data:
  path: data/dmc_walker_walk
  seq_len: 16
  obs_mode: image
  num_workers: 0
  val_fraction: 0.05
  val_seed: 0

model:
  image_size: 64
  channels: 3
  patch_size: 16
  n_latents: 8
  embed_dim: 128
  depth: 2
  num_heads: 4
  mlp_ratio: 2.0
  latent_dim: 32
  time_every: 2
  latents_only_time: true
  scale_pos_embeds: true
  dropout: 0.0
  mae_p_min: 0.0
  mae_p_max: 0.5

train:
  batch_size: 8
  max_steps: 200
  checkpoint_every: 100
  val_every: 50
  val_max_batches: 4
  devices: 1
  accelerator: gpu
  precision: bf16-mixed
  grad_clip: 1.0
  optimizer:
    lr: 3.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.01
    use_scheduler: false

log:
  dir: logs
  run_name: walker_walk/tokenizer_debug
  every_n_steps: 10
  wandb: false
  project: dreamer4-walker-walk
  viz_max_items: 2
  viz_max_T: 4
