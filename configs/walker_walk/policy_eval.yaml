# Online policy eval defaults for dreamer4-eval.
# Example: dreamer4-eval configs/walker_walk/bc_dynamics.yaml --bc-ckpt ...
eval:
  task: walker_walk
  image_size: 64
  action_repeat: 1
  max_episode_steps: 1000
  max_history: 16
  # Open-loop env steps per model forward (MTP slots 1..L). 1 = replan each step.
  action_horizon: 1
  camera_id: -1
  proprio: false
  image: true
  episodes: 50
  num_envs: 8
