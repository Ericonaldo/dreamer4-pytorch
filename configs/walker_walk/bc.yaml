stage: bc

data:
  path: data/dmc_walker_walk
  seq_len: 32
  obs_mode: both
  num_workers: 4

tokenizer_ckpt: logs/walker_walk/tokenizer/checkpoints/latest.ckpt
dynamics_ckpt: logs/walker_walk/dynamics/checkpoints/latest.ckpt

model:
  policy_hidden: 256
  reward_hidden: 256
  value_hidden: 256

train:
  batch_size: 16
  max_steps: 20_000
  checkpoint_every: 2_000
  devices: 1
  accelerator: gpu
  precision: bf16-mixed
  grad_clip: 1.0
  optimizer:
    lr: 3.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.01
    use_scheduler: false

log:
  dir: logs
  run_name: walker_walk/bc
  every_n_steps: 100
  wandb: false
  project: dreamer4-walker-walk
