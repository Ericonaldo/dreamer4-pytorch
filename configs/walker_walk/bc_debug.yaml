stage: bc

data:
  path: data/dmc_walker_walk
  seq_len: 32
  obs_mode: image
  num_workers: 0
  val_fraction: 0.05
  val_seed: 0

tokenizer_ckpt: logs/walker_walk/tokenizer/checkpoints/step-step=10000.ckpt
dynamics_ckpt: logs/walker_walk/dynamics_bk/checkpoints/last.ckpt

model:
  tokenizer:
    image_size: 64
    channels: 3
    patch_size: 8
    n_latents: 16
    embed_dim: 64
    depth: 8
    num_heads: 4
    mlp_ratio: 4.0
    latent_dim: 32
    time_every: 1
    latents_only_time: true
    scale_pos_embeds: true
    dropout: 0.0
    mae_p_min: 0.0
    mae_p_max: 0.0
  dynamics:
    embed_dim: 64
    depth: 8
    num_heads: 4
    mlp_ratio: 4.0
    dropout: 0.0
    time_every: 1
    scale_pos_embeds: true
    packing_factor: 2
    n_register: 4
    n_agent: 1
    action_dim: 6
    space_mode: wm_agent
    n_tasks: 1
    use_task_ids: true
  action_horizon: 8
  task_id: 0
  policy_hidden: 128
  reward_hidden: 128
  value_hidden: 128

train:
  batch_size: 4
  max_steps: 6
  checkpoint_every: 100
  val_every: 3
  val_max_batches: 2
  freeze_dynamics: false
  devices: 1
  accelerator: gpu
  precision: bf16-mixed
  grad_clip: 1.0
  optimizer:
    lr: 3.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.01
    use_scheduler: false

log:
  dir: logs
  run_name: walker_walk/bc_smoke
  every_n_steps: 1
  wandb: false
  project: dreamer4-walker-walk
