stage: policy

data:
  path: data/dmc_walker_walk
  seq_len: 32  # transition window: need context_length + horizon + 1 obs frames
  obs_mode: image
  num_workers: 8
  val_fraction: 0.05
  val_seed: 0

# Frozen tokenizer + BC checkpoint (dynamics + BC policy/reward heads).
tokenizer_ckpt: logs/walker_walk/tokenizer_5m/checkpoints/step-step=20000.ckpt
bc_ckpt: logs/walker_walk/bc_dynamics_10m/checkpoints/last.ckpt

model:
  tokenizer:
    image_size: 64
    channels: 3
    patch_size: 4
    n_latents: 16
    embed_dim: 128
    depth: 8
    num_heads: 4
    mlp_ratio: 2.0
    latent_dim: 32
    time_every: 1
    latents_only_time: true
    scale_pos_embeds: true
    dropout: 0.0
    mae_p_min: 0.0
    mae_p_max: 0.0
  dynamics:
    embed_dim: 256
    depth: 19
    num_heads: 4
    mlp_ratio: 2.0
    dropout: 0.0
    time_every: 1
    scale_pos_embeds: true
    packing_factor: 2
    n_register: 4
    n_agent: 1
    action_dim: 6
    space_modes: [wm_dynamics, wm_agent]
  action_horizon: 8
  policy_hidden: 512
  reward_hidden: 512
  value_hidden: 512
  reward_bins: 255
  reward_symexp_span: 20.0
  reward_layers: 1
  value_layers: 1
  log_std_min: -5.0
  log_std_max: 2.0

imagination:
  context_length: 8
  horizon: 15
  flow_steps: 8
  gamma: 0.997
  lambda: 0.95
  alpha: 0.5
  beta: 0.3

train:
  batch_size: 32
  max_steps: 50_000
  checkpoint_every: 2000
  checkpoint_keep_last: 5
  val_every: 1000
  val_max_batches: 8
  devices: 8
  accelerator: gpu
  precision: bf16-mixed
  grad_clip: 1.0
  optimizer:
    lr: 3.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.01
    use_scheduler: true

log:
  dir: logs
  run_name: walker_walk/policy
  every_n_steps: 50
  wandb: true
  project: dreamer4-walker-walk
