stage: policy

data:
  path: data/dmc_walker_walk
  seq_len: 32
  obs_mode: both
  num_workers: 4

bc_ckpt: logs/walker_walk/bc/checkpoints/latest.ckpt

imagination:
  horizon: 15
  num_rollouts: 4

train:
  batch_size: 8
  max_steps: 10_000
  checkpoint_every: 1_000
  devices: 1
  accelerator: gpu
  precision: bf16-mixed
  grad_clip: 1.0
  optimizer:
    lr: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.01
    use_scheduler: false

log:
  dir: logs
  run_name: walker_walk/policy
  every_n_steps: 50
  wandb: false
  project: dreamer4-walker-walk
