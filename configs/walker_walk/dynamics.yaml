stage: dynamics

data:
  path: data/dmc_walker_walk
  seq_len: 16
  obs_mode: image
  num_workers: 8
  val_fraction: 0.05
  val_seed: 0

tokenizer_ckpt: logs/walker_walk/tokenizer/checkpoints/step-step=10000.ckpt

model:
  tokenizer:
    image_size: 64
    channels: 3
    patch_size: 8
    n_latents: 16
    embed_dim: 64
    depth: 8
    num_heads: 4
    mlp_ratio: 2.0
    latent_dim: 32
    time_every: 1
    latents_only_time: true
    scale_pos_embeds: true
    dropout: 0.0
    mae_p_min: 0.0
    mae_p_max: 0.0
  embed_dim: 64
  depth: 8
  num_heads: 4
  mlp_ratio: 2.0
  dropout: 0.0
  time_every: 1
  scale_pos_embeds: true
  packing_factor: 2
  n_register: 4
  n_agent: 1
  action_dim: 6
  space_mode: wm_dynamics

train:
  batch_size: 64
  max_steps: 20_000
  checkpoint_every: 500
  checkpoint_keep_last: 5
  val_every: 500
  val_max_batches: 8
  rollout_ctx: 8
  rollout_horizon: 8
  rollout_flow_steps: 10
  devices: 8
  accelerator: gpu
  precision: bf16-mixed
  grad_clip: 1.0
  optimizer:
    lr: 5.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.01
    use_scheduler: true

log:
  dir: logs
  run_name: walker_walk/dynamics
  every_n_steps: 100
  wandb: true
  project: dreamer4-walker-walk
  viz_max_items: 4
