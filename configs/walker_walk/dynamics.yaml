stage: dynamics

data:
  path: data/dmc_walker_walk
  seq_len: 16
  obs_mode: both
  num_workers: 4

tokenizer_ckpt: logs/walker_walk/tokenizer/checkpoints/latest.ckpt

model:
  tokenizer:
    image_size: 64
    channels: 3
    patch_size: 16
    n_latents: 16
    embed_dim: 512
    depth: 12
    num_heads: 8
    mlp_ratio: 4.0
    latent_dim: 32
    time_every: 4
    latents_only_time: true
    scale_pos_embeds: true
    dropout: 0.0
    mae_p_min: 0.0
    mae_p_max: 0.0
  embed_dim: 512
  depth: 12
  num_heads: 8
  mlp_ratio: 4.0
  shortcut_steps: 4

train:
  batch_size: 8
  max_steps: 50_000
  checkpoint_every: 2_500
  devices: 1
  accelerator: gpu
  precision: bf16-mixed
  grad_clip: 1.0
  optimizer:
    lr: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.01
    use_scheduler: true

log:
  dir: logs
  run_name: walker_walk/dynamics
  every_n_steps: 100
  wandb: false
  project: dreamer4-walker-walk
