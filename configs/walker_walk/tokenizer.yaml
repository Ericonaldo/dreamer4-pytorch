stage: tokenizer

data:
  path: data/dmc_walker_walk
  seq_len: 16
  obs_mode: image
  num_workers: 8
  val_fraction: 0.05
  val_seed: 0

model:
  image_size: 64
  channels: 3
  patch_size: 4
  n_latents: 16
  embed_dim: 128
  depth: 8
  num_heads: 4
  mlp_ratio: 2.0
  latent_dim: 32
  time_every: 1
  latents_only_time: true
  scale_pos_embeds: true
  dropout: 0.05
  mae_p_min: 0.0
  mae_p_max: 0.9

train:
  batch_size: 64
  max_steps: 20_000
  checkpoint_every: 1000
  checkpoint_keep_last: 5
  val_every: 100
  val_max_batches: 32
  devices: 8
  accelerator: gpu
  precision: bf16-mixed
  grad_clip: 1.0
  optimizer:
    lr: 5.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.01
    use_scheduler: true

log:
  dir: logs
  run_name: walker_walk/tokenizer_5m
  every_n_steps: 100
  wandb: true
  project: dreamer4-walker-walk
  viz_max_items: 4
  viz_max_T: 6
