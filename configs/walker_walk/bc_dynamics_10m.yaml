stage: bc_dynamics

data:
  path: data/dmc_walker_walk
  seq_len: 16
  obs_mode: image
  num_workers: 8
  val_fraction: 0.05
  val_seed: 0

# Must match tokenizer_5m.yaml arch (frozen encode only).
tokenizer_ckpt: logs/walker_walk/tokenizer_5m/checkpoints/step-step=20000.ckpt
dynamics_ckpt: null  # optional warm start from dynamics-only pretrain at same scale

model:
  tokenizer:
    image_size: 64
    channels: 3
    patch_size: 4
    n_latents: 16
    embed_dim: 128
    depth: 8
    num_heads: 4
    mlp_ratio: 2.0
    latent_dim: 32
    time_every: 1
    latents_only_time: true
    scale_pos_embeds: true
    dropout: 0.0
    mae_p_min: 0.0
    mae_p_max: 0.0
  dynamics:
    # ~100M trainable (dynamics + BC heads); ref uses 512d/8L/mlp4 (~43M dynamics only)
    embed_dim: 256
    depth: 19
    num_heads: 4
    mlp_ratio: 2.0
    dropout: 0.0
    time_every: 1
    scale_pos_embeds: true
    packing_factor: 2
    n_register: 4
    n_agent: 1
    action_dim: 6
    space_modes: [wm_dynamics, wm_agent]  # flow uses wm_dynamics, BC uses wm_agent (auto)
    space_mode: wm_dynamics  # default for flow / rollout when space_mode omitted
  action_horizon: 8
  policy_hidden: 512
  reward_hidden: 512
  reward_bins: 255
  reward_symexp_span: 20.0
  reward_layers: 1
  log_std_min: -5.0
  log_std_max: 2.0

train:
  batch_size: 32  # per GPU; reduce if OOM (~100M backbone)
  max_steps: 50_000
  checkpoint_every: 2000
  checkpoint_keep_last: 5
  val_every: 1000
  val_max_batches: 8
  flow_weight: 1.0
  action_weight: 1.0
  reward_weight: 0.1
  rollout_ctx: 8
  rollout_horizon: 8
  rollout_flow_steps: 10
  devices: 8
  accelerator: gpu
  precision: bf16-mixed
  grad_clip: 1.0
  optimizer:
    lr: 5e-4
    betas: [0.9, 0.95]
    weight_decay: 0.01
    use_scheduler: true

log:
  dir: logs
  run_name: walker_walk/bc_dynamics_10m
  every_n_steps: 100
  wandb: true
  project: dreamer4-walker-walk
  viz_max_items: 4

eval:
  task: walker_walk
  image_size: 64
  action_repeat: 1
  max_episode_steps: 1000
  max_history: 16
  camera_id: -1
  proprio: false
  image: true
  episodes: 8
  num_envs: 8
  gpu_ids: all
  env_eval: true
