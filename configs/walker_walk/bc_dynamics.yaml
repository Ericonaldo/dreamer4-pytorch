stage: bc_dynamics

data:
  paths:
    - data/dmc_walker_walk
    - data/dmc_walker_walk_random500
  seq_len: 16
  obs_mode: image
  num_workers: 8
  val_fraction: 0.05
  val_seed: 0

# Must match tokenizer.yaml arch (frozen encode only; default log run_name: walker_walk/tokenizer).
tokenizer_ckpt: logs/walker_walk/tokenizer/checkpoints/last.ckpt

model:
  tokenizer:
    image_size: 64
    channels: 3
    patch_size: 8
    n_latents: 16
    embed_dim: 64
    depth: 8
    num_heads: 4
    mlp_ratio: 2.0
    latent_dim: 32
    time_every: 1
    latents_only_time: true
    scale_pos_embeds: true
    dropout: 0.0
    mae_p_min: 0.0
    mae_p_max: 0.0
  dynamics:
    # 128d/16L/mlp2 → ~4.5M trainable (dynamics ~3.8M + BC heads); ref 512d/8L/mlp4 ~43M dynamics only
    embed_dim: 128
    depth: 16
    num_heads: 4
    mlp_ratio: 2.0
    dropout: 0.0
    time_every: 1
    scale_pos_embeds: true
    packing_factor: 2
    n_register: 4
    n_agent: 1
    action_dim: 6
    k_max: 64  # finest flow grid; inference flow_steps must divide k_max
  action_horizon: 8
  policy_hidden: 256
  reward_hidden: 256
  reward_layers: 2
  min_std: 0.1
  max_std: 1.0

train:
  batch_size: 64
  max_steps: 100_000
  checkpoint_every: 2000
  checkpoint_keep_last: 5
  val_every: 1000
  val_max_batches: 32
  flow_weight: 1.0
  shortcut_self_fraction: 0.25
  shortcut_bootstrap_start: 5000
  action_weight: 1.0
  reward_weight: 0.1
  rollout_ctx: 8
  rollout_horizon: 8
  rollout_flow_steps: 4
  devices: 8
  accelerator: gpu
  precision: bf16-mixed
  grad_clip: 1.0
  optimizer:
    lr: 5e-4
    betas: [0.9, 0.95]
    weight_decay: 0.01
    use_scheduler: true

log:
  dir: logs
  run_name: walker_walk/bc_dynamics
  every_n_steps: 100
  wandb: true
  project: dreamer4-walker-walk
  viz_max_items: 4

eval:
  task: walker_walk
  image_size: 64
  action_repeat: 1
  max_episode_steps: 1000
  max_history: 16
  camera_id: -1
  proprio: false
  image: true
  episodes: 8
  num_envs: 8
  gpu_ids: all
  env_eval: true
