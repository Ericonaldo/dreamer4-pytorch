stage: rl

data:
  path: data/dmc_walker_walk
  seq_len: 16  # transition window; imagination context suffix in [context_len_min, seq_len]
  obs_mode: image
  num_workers: 8
  val_fraction: 0.05
  val_seed: 0

# Warm-start from joint BC+dynamics checkpoint (same arch as bc_dynamics.yaml).
tokenizer_ckpt: logs/walker_walk/tokenizer/checkpoints/step-step=20000.ckpt
bc_ckpt: logs/walker_walk/bc_dynamics/checkpoints/last.ckpt

model:
  tokenizer:
    image_size: 64
    channels: 3
    patch_size: 8
    n_latents: 16
    embed_dim: 64
    depth: 8
    num_heads: 4
    mlp_ratio: 2.0
    latent_dim: 32
    time_every: 1
    latents_only_time: true
    scale_pos_embeds: true
    dropout: 0.0
    mae_p_min: 0.0
    mae_p_max: 0.0
  dynamics:
    embed_dim: 128
    depth: 16
    num_heads: 4
    mlp_ratio: 2.0
    dropout: 0.0
    time_every: 1
    scale_pos_embeds: true
    packing_factor: 2
    n_register: 4
    n_agent: 1
    action_dim: 6
    k_max: 64
    space_modes: [wm_dynamics, wm_agent]
    space_mode: wm_dynamics
  action_horizon: 8
  policy_hidden: 256
  reward_hidden: 256
  value_hidden: 256
  reward_layers: 1
  value_layers: 1
  log_std_min: -5.0
  log_std_max: 2.0

imagination:
  horizon: 8
  flow_steps: 4
  context_len_min: 8
  gamma: 0.997
  lambda_: 0.95
  alpha: 0.5
  beta: 0.3
  policy_warmup_steps: 500
  policy_lr: 3.0e-5

train:
  batch_size: 64
  max_steps: 10_000
  checkpoint_every: 1000
  checkpoint_keep_last: 5
  val_every: 500
  val_max_batches: 32
  devices: 4
  accelerator: gpu
  precision: 32-true  # RL PMPO numerically sensitive; BC/dynamics use bf16-mixed
  grad_clip: 1.0
  optimizer:
    lr: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.01
    use_scheduler: false

log:
  dir: logs
  run_name: walker_walk/rl_pmpo
  every_n_steps: 50
  wandb: true
  project: dreamer4-walker-walk

eval:
  task: walker_walk
  image_size: 64
  action_repeat: 1
  max_episode_steps: 1000
  max_history: 16
  action_horizon: 1
  camera_id: -1
  proprio: false
  image: true
  episodes: 8
  num_envs: 8
  gpu_ids: all
  env_eval: true
